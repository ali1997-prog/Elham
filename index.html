<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Elham — Admin</title>
<style>
:root{--brand:#8B1A1E;--brand-h:#6f1417;--brand-soft:#f7ebec;--gray:#7D7F83;--bg:#f4f4f6;--card:#fff;--ink:#1d2129;--muted:#626873;--line:#e3e5e9;
--ok:#1b7a45;--ok-soft:#e4f4eb;--bad:#b42318;--bad-soft:#fdecea;--warn:#8a5a00;--warn-soft:#fff3dc;--shadow:0 1px 2px rgba(16,24,40,.05)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text","SF Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.6}
button,input,select{font:inherit}
a{color:var(--brand)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);text-decoration:none}
.btn:hover{background:#f3f3f5}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-h)}
.btn.danger{color:var(--bad);border-color:#f0c6c2}
.btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent}
.btn.ghost:hover{background:#ececef}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=tel],select{border:1px solid #cfd3d9;border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus{outline:2px solid #e2b3b5;border-color:var(--brand)}
.ltr{direction:ltr;text-align:left}
label.f{display:grid;gap:4px;font-weight:600;font-size:14px}
label.f small{font-weight:400;color:var(--muted)}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.ok-msg{color:var(--ok);font-size:14px}.ok-msg:empty{display:none}
.perm-list{display:grid;gap:8px}.perm-list label{display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer}.perm-list input{width:18px;height:18px;accent-color:var(--brand,#8B1A1E)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.langbtn{font-weight:600}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:14px}
.login-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:0 8px 30px rgba(16,24,40,.06)}
.login-card img{display:block;height:76px;margin:0 auto 12px}
.login-card h1{font-size:20px;text-align:center;margin:0 0 2px}
.login-card p.sub{text-align:center;color:var(--muted);margin:0 0 22px;font-size:14px}
.login-card form{display:grid;gap:14px}
/* shell */
#app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{background:#fff;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
aside .brand{padding:18px 16px 14px;border-bottom:1px solid var(--line);text-align:center}
aside .brand img{height:54px}
aside .brand div{font-size:12px;color:var(--muted);margin-top:6px}
aside nav{display:flex;flex-direction:column;padding:12px 10px;gap:2px}
aside nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#3a3f48;text-decoration:none;font-weight:500}
aside nav a:hover{background:#f4f4f6}
aside nav a.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
aside .me{margin-top:auto;padding:14px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:grid;gap:8px}
aside .me b{display:block;color:var(--ink);word-break:break-all;font-weight:600}
aside .me .row2{display:flex;gap:6px}
main{padding:26px 28px;min-width:0;max-width:1300px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:23px;margin:0;font-weight:700}
.head .sub{color:var(--muted);font-size:14px}
.crumb{color:var(--muted);text-decoration:none;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 12px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:27px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat.ok .v{color:var(--ok)} .stat.bad .v{color:var(--bad)} .stat.brand .v{color:var(--brand)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#fafafb;text-align:start;font-weight:600;color:var(--muted);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f0f1f3;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:#fcf7f7}
td.nowrap{white-space:nowrap}
.empty{padding:30px;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-bad{background:var(--bad-soft);color:var(--bad)}
.b-warn{background:var(--warn-soft);color:var(--warn)} .b-gray{background:#eef0f2;color:#4b5058}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c3c6cb;margin-inline-end:7px;vertical-align:1px}
.dot.on{background:#22a35a;box-shadow:0 0 0 3px #22a35a22}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.filters label{display:grid;gap:3px;font-size:13px;color:var(--muted)}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 20px}
.kv div span.k{display:block;font-size:12px;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.muted{color:var(--muted)}
.mono{font-family:Menlo,Consolas,monospace;direction:ltr;unicode-bidi:isolate}
.overlay{position:fixed;inset:0;background:rgba(17,19,24,.48);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:16px;width:100%;max-width:470px;padding:24px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal h3{margin:0 0 14px;font-size:18px}
.modal form{display:grid;gap:12px}
.modal .row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.codebox{font-family:Menlo,Consolas,monospace;font-size:28px;letter-spacing:2px;text-align:center;background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:14px;direction:ltr;user-select:all;font-weight:700}
.note{background:var(--warn-soft);color:#5c3c00;border-radius:8px;padding:10px 12px;font-size:14px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1d2129;color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.bad{background:var(--bad)}
.loading{opacity:.55;pointer-events:none}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
@media (max-width:860px){
 #app{grid-template-columns:minmax(0,1fr)}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .head h1{font-size:20px}
 aside{position:static;height:auto;border-inline-end:0;border-bottom:1px solid var(--line)}
 aside .brand{display:flex;align-items:center;gap:10px;justify-content:center;padding:10px}
 aside .brand img{height:36px} aside .brand div{margin:0}
 aside nav{flex-direction:row;overflow-x:auto;padding:6px}
 aside nav a{white-space:nowrap;padding:7px 10px}
 aside .me{grid-template-columns:1fr auto;align-items:center;margin-top:0;padding:8px 12px}
 main{padding:16px}
}
.pw-wrap{position:relative;display:block}
.pw-wrap input{width:100%;padding-right:42px!important;box-sizing:border-box}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;padding:4px 6px;font-size:18px;line-height:1;color:#7D7F83;border-radius:6px}
.pw-eye:hover{background:#eef0f3}.pw-eye:focus-visible{outline:2px solid #8B1A1E}
</style>
</head>

function ago(v){

}
function isOnline(v){ return !!v && (Date.now() - new Date(v).getTime()) < CONFIG.ONLINE_MINUTES*60000; }
function dur(ms){ if(ms==null) return "—"; const s=Math.round(ms/1000); if(s<60) return s+" "+t("sec"); const m=Math.floor(s/60); return m+" "+t("min")+" "+(s%60)+" "+t("sec"); }

function toast(msg, bad=false){ const el=$("#toast"); el.textContent=msg; el.className=bad?"bad":""; clearTimeout(toast._t); toast._t=setTimeout(()=>el.className="hidden", bad?6000:3000); }

function counts(l){

const SKEY = "elham-admin-session-v1";
let session = null;
function loadSession(){ try{ session = JSON.parse(localStorage.getItem(SKEY)||"null"); }catch(e){ session=null; } }
function saveSession(s){ session=s; try{ s ? localStorage.setItem(SKEY, JSON.stringify(s)) : localStorage.removeItem(SKEY); }catch(e){} }
class ApiError extends Error { constructor(msg, code, status){ super(msg); this.code=code; this.status=status; } }
function friendlyError(body, status){
  const code = body && (body.code || body.error_code || body.error);
  const raw = String(body && (body.message || body.msg || body.error_description) || "");
  if(status===0) return t("eNet");
  if(code==="invalid_grant" || code==="invalid_credentials" || /invalid login/i.test(raw)) return t("eLogin");
  if(body && (body.error_code==="same_password" || /different from the old/i.test(raw))) return t("spSame");
  if(code==="weak_password" || /weak|should be at least|password should/i.test(raw)) return t("eWeak");
  if(code==="23505") return t("eDup");
  if(code==="23514" || code==="22001" || code==="22P02") return t("eData");
  if(code==="42501") return t("ePerm");
  if(code==="PGRST301" || code==="PGRST303" || status===401) return t("sessionEnded");
  if(/[؀-ۿ]/.test(raw)) return LANG==="en" ? (DB_MSG_EN[raw.trim()] || raw) : raw;
  return t("eUnknown") + (raw ? ": " + raw : "") + ".";
}
async function http(path, {method="GET", body, auth=true}={}){
  const h = {"apikey": CONFIG.SUPABASE_KEY, "Content-Type":"application/json"};
  if(auth && session) h["Authorization"] = "Bearer " + session.access_token;
  let res;
  try{ res = await fetch(CONFIG.SUPABASE_URL + path, {method, headers:h, body: body===undefined?undefined:JSON.stringify(body)}); }
  catch(e){ throw new ApiError(t("eNet"), "network", 0); }
  const text = await res.text();
  let data = null; try{ data = text ? JSON.parse(text) : null; }catch(e){ data = {message:text}; }
  if(!res.ok) throw new ApiError(friendlyError(data, res.status), data && data.code, res.status);
  return data;
}
async function signIn(email, password){
  const d = await http("/auth/v1/token?grant_type=password", {method:"POST", auth:false, body:{email, password}});
  saveSession({access_token:d.access_token, refresh_token:d.refresh_token, expires_at: Date.now() + (d.expires_in||3600)*1000, email:(d.user && d.user.email) || email});
}
async function refresh(){
  if(!session || !session.refresh_token) throw new ApiError(t("sessionEnded"), "nosession", 401);
  const d = await http("/auth/v1/token?grant_type=refresh_token", {method:"POST", auth:false, body:{refresh_token: session.refresh_token}});
  saveSession({...session, access_token:d.access_token, refresh_token:d.refresh_token, expires_at: Date.now() + (d.expires_in||3600)*1000});
}
async function signOut(){ try{ await http("/auth/v1/logout", {method:"POST"}); }catch(e){} saveSession(null); employeesCache=null; showLogin(); }
async function api(path, opts={}){
  const expired = () => { saveSession(null); showLogin(t("sessionEnded")); };
  if(session && Date.now() > session.expires_at - 60000){ try{ await refresh(); }catch(e){ expired(); throw e; } }
  try{ return await http(path, opts); }
  catch(e){
    if(e.status===401 && session){ try{ await refresh(); return await http(path, opts); }catch(e2){ expired(); throw e2; } }
    throw e;
  }
}
const rpc = (fn, args={}) => api("/rest/v1/rpc/" + fn, {method:"POST", body:args});
function q(table, params){ const u = new URLSearchParams(); for(const [k,v] of params) u.append(k, v); return api("/rest/v1/" + table + "?" + u.toString()); }

const view = () => $("#view");

let routing = false, routeAgain = false;
async function route(){
  if(routing){ routeAgain = true; return; }
  routing = true;
  try{ do{ routeAgain = false; await routeOnce(); } while(routeAgain); }
  finally{ routing = false; }
}
async function routeOnce(){
  if(!session) return;
  const parts = (location.hash.replace(/^#\/?/,"") || "home").split("/");
  const r = parts[0];
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.r === (r==="employee"?"employees":r)));
  view().innerHTML = `<div class="empty">${t("loading")}</div>`;
  try{
    const need = {logs:()=>can("logs"), reports:()=>can("reports"), audit:()=>can("audit"), admins:isOwner}[r];
    if(need && !need()){ location.hash = "#/home"; return; }
    if(r==="home") await pageHome();
    else if(r==="employees") await pageEmployees();
    else if(r==="employee") await pageEmployee(decodeURIComponent(parts[1]||""));
    else if(r==="logs") await pageLogs();
    else if(r==="audit") await pageAudit();
    else if(r==="reports") await pageReports();
    else if(r==="admins") await pageAdmins();
    else if(r==="settings") await pageSettings();
    else { location.hash = "#/home"; return; }
    view().insertAdjacentHTML("beforeend", footer());
  }catch(e){ if(session) view().innerHTML = `<div class="card"><div class="err">${esc(e.message)}</div><button class="btn" id="rtry">${t("retry")}</button></div>`; const b=$("#rtry"); if(b) b.onclick=route; }
}

async function copy(text, okMsg){
  try{ await navigator.clipboard.writeText(text); toast(okMsg); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast(okMsg); }catch(e2){ toast(t("copyManual"), true); } ta.remove(); }
}

/* ===== Filters + log (shared) ===== */
function filtersHtml(withEmp){
  const today = riyadhDate();
  const opts = obj => Object.entries(obj).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("");
  return `<div class="filters">
    ${withEmp?`<label>${t("fEmp")}<select id="fEmp"><option value="">${t("allEmps")}</option>${(employeesCache||[]).map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join("")}</select></label>`:""}
    <label>${t("fFrom")}<input type="date" id="fFrom" value="${today}"></label>
    <label>${t("fTo")}<input type="date" id="fTo" value="${today}"></label>
    <label>${t("fAction")}<select id="fAct"><option value="">${t("all")}</option>${opts(STR[LANG].act)}</select></label>
    <label>${t("fResult")}<select id="fRes"><option value="">${t("all")}</option>${opts(STR[LANG].res)}</select></label>
    <button class="btn primary" id="fGo">${t("show")}</button>
    <button class="btn" id="fToday">${t("today")}</button>
    <button class="btn" id="fWeek">${t("last7")}</button>
    ${can("export")?`<button class="btn" id="fCsv">${icon("dl")}${t("exportX")}</button>`:""}
  </div><div class="err" id="fErr"></div>`;
}
function readFilters(base){
  const f = {from: $("#fFrom").value, to: $("#fTo").value, act: $("#fAct").value, res: $("#fRes").value, emp: base.employeeId || ($("#fEmp") ? $("#fEmp").value : "")};
  if(!f.from || !f.to) throw new Error(t("errDates"));
  if(f.from > f.to) throw new Error(t("errOrder"));
  return f;
}
function filterParams(f){
  const p = [["occurred_at","gte."+dayStart(f.from)],["occurred_at","lt."+dayEnd(f.to)]];
  if(f.emp) p.push(["employee_id","eq."+f.emp]);
  if(f.act) p.push(["action","eq."+f.act]);
  if(f.res) p.push(["result","eq."+f.res]);
  return p;
}
function bindFilters(base){
  const st = {page:0};
  const tbl = $("#fTable"), stats = $("#fStats"), errEl = $("#fErr");
  const alive = () => document.body.contains(tbl);
  const load = async () => {
    if(!alive()) return;
    errEl.textContent = "";
    let f; try{ f = readFilters(base); }catch(e){ errEl.textContent = e.message; return; }
    tbl.classList.add("loading");
    try{
      const [rows, sums] = await Promise.all([
        q("activity_logs", [["select","*"], ...filterParams(f), ["order","occurred_at.desc"], ["limit", String(CONFIG.PAGE_SIZE+1)], ["offset", String(st.page*CONFIG.PAGE_SIZE)]]),
        q("activity_logs", [["select","action,result,count_success,count_failed,count_skipped"], ...filterParams(f), ["limit","10000"]])
      ]);
      if(!alive()) return;
      const more = rows.length > CONFIG.PAGE_SIZE; const shown = rows.slice(0, CONFIG.PAGE_SIZE);
      const work = sums.filter(r=>["checkin","checkout","passport_review"].includes(r.action));
      const s = k => work.reduce((a,r)=>a+(Number(r[k])||0),0);
      stats.innerHTML = `
        <div class="stat"><div class="l">${t("sOps")}</div><div class="v">${sums.length}${sums.length>=10000?"+":""}</div></div>
        <div class="stat ok"><div class="l">${t("sSucc")}</div><div class="v">${s("count_success")}</div></div>
        <div class="stat bad"><div class="l">${t("sFail")}</div><div class="v">${s("count_failed")}</div></div>
        <div class="stat"><div class="l">${t("sSkip")}</div><div class="v">${s("count_skipped")}</div></div>
        <div class="stat bad"><div class="l">${t("sErr")}</div><div class="v">${sums.filter(r=>r.action==="error"||r.result==="failed").length}</div></div>`;
      tbl.innerHTML = logsTable(shown, !base.employeeId) + `<div class="pager"><span>${esc(t("pageN",{p:st.page+1,n:shown.length}))}</span><span class="actions">
        <button class="btn sm" id="pPrev" ${st.page===0?"disabled":""}>${t("prev")}</button><button class="btn sm" id="pNext" ${more?"":"disabled"}>${t("next")}</button></span></div>`;
      $("#pPrev").onclick = () => { st.page--; load(); };
      $("#pNext").onclick = () => { st.page++; load(); };
    }catch(e){ if(alive()) errEl.textContent = e.message; }
    finally{ tbl.classList.remove("loading"); }
  };
  $("#fGo").onclick = () => { st.page = 0; load(); };
  $("#fToday").onclick = () => { const d = riyadhDate(); $("#fFrom").value = d; $("#fTo").value = d; st.page = 0; load(); };
  $("#fWeek").onclick = () => { $("#fFrom").value = riyadhDate(new Date(Date.now()-6*86400000)); $("#fTo").value = riyadhDate(); st.page = 0; load(); };
  if($("#fCsv")) $("#fCsv").onclick = () => exportCsv(base);
  load();
}
async function exportCsv(base){
  let f; try{ f = readFilters(base); }catch(e){ $("#fErr").textContent = e.message; return; }
  $("#fCsv").disabled = true;
  try{
    const all = []; let off = 0;
    while(true){
      const part = await q("activity_logs", [["select","*"], ...filterParams(f), ["order","occurred_at.asc"], ["limit","1000"], ["offset", String(off)]]);
      all.push(...part); if(part.length < 1000 || all.length >= 50000) break; off += 1000;
    }
    if(all.length===0){ toast(t("noExport"), true); return; }
    const cell = v => { let s = String(v ?? ""); if(/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g,'""') + '"'; };
    const lines = [STR[LANG].csvHead.map(cell).join(",")].concat(all.map(l => { const d = l.details || {}; return [dt(l.occurred_at), empName(l.employee_id), actName(l.action), l.result?(STR[LANG].res[l.result]||l.result):"", d.agreement, d.program, l.group_no, d.hotel, d.city, d.program_date, d.actual_date, d.actual_time, l.count_total, l.count_success, l.count_failed, l.count_skipped, l.duration_ms!=null?Math.round(l.duration_ms/1000):"", l.message, d.preview ? "✓" : "", d.mode === "silent" ? t("modeSilent") : d.mode === "visible" ? t("modeVisible") : "", l.ext_version].map(cell).join(","); }));
    const blob = new Blob(["﻿" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `${base.fileName||"elham-activity-log"}_${f.from}_${f.to}.csv`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    toast(t("exported",{n:all.length}));
  }catch(e){ toast(e.message, true); }
  finally{ const b = $("#fCsv"); if(b) b.disabled = false; }
}

  const det = r => { const d = r.details||{}; if(r.action==="issue_code") return d.expires_at?t("expires",{d:dt(d.expires_at)}):t("noExpiry");

function showReport(r){
  const p = r.payload || {}, run = p.run || {}, prm = run.params || {}, plan = run.plan || [], eng = p.engine;
  const failed = plan.filter(x => x.status === "failed" || x.status === "not_found");
  const apiErr = eng && eng.diag ? eng.diag.filter(d => d.kind === "api" && !d.ok).slice(-15) : [];
  const steps = eng && eng.diag ? eng.diag.filter(d => d.kind === "step").slice(-15) : [];
  const missing = eng && eng.selectors ? Object.entries(eng.selectors).filter(([k,v]) => v === 0 || v === "bad").map(([k]) => k) : [];
  const sec = (title, body) => `<h4 style="margin:16px 0 6px">${esc(title)}</h4>${body}`;
  const mini = (head, rows) => `<div class="tbl-wrap"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(c=>`<tr>${c.map(v=>`<td>${esc(v==null?"":String(v))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  openModal(`<h3>${esc(t("repReport",{n:r.id}))} — ${r.kind==="auto"?t("kindAuto"):t("kindManual")}</h3>
    <p><b>${esc(r.summary||"")}</b></p>
    <p class="muted" style="font-size:13px">${t("repEmp")}: ${esc(empName(r.employee_id))} · ${esc(dt(r.created_at))} · ${t("repVer")}: ${esc(r.ext_version||p.ext_version||"—")}</p>
    ${r.note?`<div class="note">${t("repNote")}: ${esc(r.note)}</div>`:""}
    ${sec(t("repParams"), `<p class="mono" style="font-size:13px;direction:ltr;text-align:left">${esc(JSON.stringify({ mode: prm.mode||"visible", dates: prm.dates, time: prm.timeMode, fixed: prm.timeFixed, groups: prm.groupsMode, preview: prm.preview, status: run.status, reason: run.reason }))}</p>`)}
    ${sec(t("repFailed"), failed.length ? mini([t("thGroup"),"status",t("thNote")], failed.map(x=>[x.group, x.status, x.note])) : `<p class="muted">${t("repNoFailed")}</p>`)}
    ${apiErr.length ? sec(t("repApi"), mini(["name","HTTP","desc"], apiErr.map(d=>[d.name, d.status, d.desc||d.errors||""]))) : ""}
    ${steps.length ? sec(t("repSteps"), mini(["code","msg"], steps.map(d=>[d.code, d.msg]))) : ""}
    ${sec(t("repPage"), eng ? `<p class="mono" style="font-size:13px;direction:ltr;text-align:left">${esc(eng.page||"")} · list:${eng.isList} · details:${eng.isDetails} · dialog:${eng.dialog}</p>${missing.length?`<p class="muted" style="font-size:13px">${t("repMissing")}: <span class="mono">${esc(missing.join(", "))}</span></p>`:""}` : `<p class="muted">${t("repNoEngine")}</p>`)}
    ${sec(t("repLogs"), `<div class="mono" style="font-size:12px;max-height:220px;overflow:auto;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:8px">${(p.logs||[]).slice(0,60).map(l=>`<div>[${esc(dt(l.t))}] ${esc(l.text)}</div>`).join("")}</div>`)}
    <div class="row" style="margin-top:14px"><button class="btn" id="repClose">${t("cancel")}</button></div>`);
  const m = document.querySelector("#modalRoot .modal"); if(m) m.style.maxWidth = "900px";
  $("#repClose").onclick = closeModal;
}

const pickedPerms = () => [...document.querySelectorAll("#modalRoot .perm-list input:checked")].map(i=>i.value);

  ${admins.map(a=>`<tr><td class="nowrap"><b>${esc(a.name)}</b> ${a.role==="owner"?`<span class="badge b-ok">${t("roleOwner")}</span>`:""} ${a.email && a.email===me?`<span class="muted">${t("admYou")}</span>`:""}</td>

    <td>${a.role==="manager"?`<div class="actions">${a.must_change_password?`<button class="btn sm" data-ashow="${esc(a.user_id)}">${icon("copy")}${t("admShowCode")}</button>`:""}<button class="btn sm" data-aedit="${esc(a.user_id)}">${icon("edit")}${t("edit")}</button><button class="btn sm" data-areset="${esc(a.user_id)}">${icon("key")}${t("admReset")}</button><button class="btn sm danger" data-adel="${esc(a.user_id)}">${t("admRemove")}</button></div>`:""}</td></tr>`).join("")}
  </tbody></table></div>
  ${admins.length<=1?`<p class="muted">${t("admNone")}</p>`:""}`;

  view().querySelectorAll("[data-adel]").forEach(b => b.onclick = async () => {
    const a = find(b.dataset.adel);
    if(await confirmBox(t("admRemoveT"), t("admRemoveX",{n:esc(a.name)}), t("admRemove"))){ try{ await rpc("admin_remove_admin",{p_user_id:a.user_id}); toast(t("admRemoved")); route(); }catch(e){ toast(e.message,true); } }
  });
  view().querySelectorAll("[data-areset]").forEach(b => b.onclick = async () => {
    const a = find(b.dataset.areset);
    if(!(await confirmBox(t("admResetT",{n:a.name}), t("admResetX",{n:esc(a.name)}), t("admReset")))) return;
    try{ const r = await rpc("admin_reset_admin_password",{p_user_id:a.user_id}); showFirstCode(a.name, a.email, r.code, t("admReset")); }catch(e){ toast(e.message,true); }
  });
  view().querySelectorAll("[data-ashow]").forEach(b => b.onclick = async () => {
    const a = find(b.dataset.ashow);
    try{ const r = await rpc("admin_get_temp_code",{p_user_id:a.user_id}); if(r && r.code) showFirstCode(a.name, a.email, r.code, t("admFirstCode")); else route(); }catch(e){ toast(e.message,true); }

function firstCodeMessage(name, email, code){ return t("admMsg",{n:name, e:email, c:code, u: location.origin + location.pathname}); }
function showFirstCode(name, email, code, title){
  openModal(`<h3>${esc(title)}</h3><div class="note">${t("admCodeNote")}</div>
    <label class="f">${t("admFirstCode")}<input class="mono ltr" id="invCodeOut" readonly value="${esc(code)}"></label>
    <textarea id="invMsg" readonly style="width:100%;height:190px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px;box-sizing:border-box">${esc(firstCodeMessage(name, email, code))}</textarea>
    <div class="row"><button class="btn primary" id="invCopy">${icon("copy")}${t("admCopyMsg")}</button><button class="btn" id="invDone">${t("cancel")}</button></div>`);
  $("#invCopy").onclick = async () => { try{ await navigator.clipboard.writeText($("#invMsg").value); toast(t("admMsgCopied")); }catch(e){ $("#invMsg").select(); document.execCommand("copy"); toast(t("admMsgCopied")); } };
  $("#invDone").onclick = () => { closeModal(); route(); };
}
function adminForm(a){
  const edit = !!a;
  openModal(`<h3>${edit?esc(t("admEditT",{n:a.name})):t("admNewT")}</h3><form id="admForm" novalidate>
    <label class="f">${t("admName")}<input id="aName" value="${edit?esc(a.name):""}" maxlength="100"></label>
    ${edit?"":`<label class="f">${t("admEmail")}<input type="email" id="aEmail" class="ltr" maxlength="200"></label>`}
    <div><div style="font-weight:600;margin-bottom:6px">${t("admPerms")}</div>${permBoxes(edit?(a.permissions||[]):["employees","codes"])}</div>
    ${edit?`<label class="f">${t("admStatus")}<select id="aStatus"><option value="active" ${a.status==="active"?"selected":""}>${t("admActive")}</option><option value="suspended" ${a.status==="suspended"?"selected":""}>${t("admSusp")}</option></select></label>`:""}
    <div class="err" id="aErr"></div>
    <div class="row"><button class="btn primary" type="submit" id="aSave">${edit?t("admSave"):t("admAdd")}</button><button class="btn" type="button" id="aCancel">${t("cancel")}</button></div></form>`);
  $("#aCancel").onclick = closeModal;
  $("#admForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const name = $("#aName").value.trim(), perms = pickedPerms(), err = $("#aErr"); err.textContent = "";
    if(name.length < 2) return err.textContent = t("eData");
    if(!perms.length) return err.textContent = t("admNeedPerm");
    $("#aSave").disabled = true;
    try{
      if(edit){ await rpc("admin_update_admin",{p_user_id:a.user_id, p_name:name, p_permissions:perms, p_status:$("#aStatus").value}); closeModal(); toast(t("admSaved")); route(); }
      else{
        const email = $("#aEmail").value.trim().toLowerCase();
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { $("#aSave").disabled = false; return err.textContent = t("admBadEmail"); }
        const r = await rpc("admin_add_admin",{p_email:email, p_name:name, p_permissions:perms});
        showFirstCode(name, email, r.code, t("admCreated"));
      }
    }catch(e){ err.textContent = e.message; $("#aSave").disabled = false; }
  });
}

  </div>
  ${isOwner()?`<div class="card" id="tgCard"><h2>${t("tgTitle")}</h2><p class="muted" style="font-size:14px">${t("tgIntro")}</p>
    <div id="tgStatus" class="muted">…</div>
    <form id="tgForm" novalidate style="display:grid;gap:12px;max-width:420px;margin-top:12px">
      <label class="f"><span>${t("tgToken")} <small>${t("tgTokenHint")}</small></span><input type="password" id="tgToken" class="ltr" autocomplete="off"></label>
      <label class="f"><span>${t("tgChat")} <small>${t("tgChatHint")}</small></span><input id="tgChat" class="ltr" autocomplete="off"></label>
      <div class="err" id="tgErr"></div>
      <div style="display:flex;gap:8px"><button class="btn primary" id="tgSave" type="submit">${t("tgSave")}</button><button class="btn" id="tgTest" type="button">${t("tgTest")}</button></div>
    </form></div>`:""}
  ${can("purge")?`<div class="card"><h2>${t("purgeTitle")}</h2><p>${t("purgeText")}</p>
    <div class="filters"><label>${t("olderThan")}<select id="pgM"><option value="12">${t("m12")}</option><option value="6">${t("m6")}</option><option value="24">${t("m24")}</option></select></label>
    <button class="btn danger" id="pgBtn">${t("purgeBtn")}</button></div></div>`:""}
  <div class="card"><h2>${t("about")}</h2><p class="muted" style="font-size:14px">${t("aboutText")}</p></div>`;
  if($("#tgCard")){
    const showTg = async () => { try{
      const st = await rpc("admin_complaints_status");
      const row = (k, v) => `<div><span class="k">${k}:</span> ${v}</div>`;
      const yes = b => b ? `<span class="badge b-ok">${t("tgOk")}</span>` : `<span class="badge b-gray">${t("tgNo")}</span>`;
      const mon = st.down_since ? `<span class="badge b-bad">${t("tgMonDown",{t:dt(st.down_since)})}</span>` : st.last_ok ? t("tgMonOn",{e:esc(st.leader||"—"), t:dt(st.last_ok)}) : t("tgMonNone");
      const lm = st.last_message ? `${esc(({new:"🔔 بلاغ جديد",status:"🔄 تغيّر حالة",down:"⚠️ توقف المراقبة",up:"✅ رجوع المراقبة",start:"✅ بداية المراقبة",test:"🧪 تجربة"})[st.last_message.kind]||st.last_message.kind)} · ${dt(st.last_message.at)} · ${st.last_message.error ? '<span class="badge b-bad">'+esc(st.last_message.error)+'</span>' : (st.last_message.sent ? t("tgSent") : t("tgPending"))}` : "—";
      $("#tgStatus").innerHTML = row(t("tgBot"), yes(st.bot_set)) + row(t("tgChatS"), yes(st.chat_set)) + row(t("tgMon"), mon) + row(t("tgLast"), lm)
        + (!(st.pg_net && st.pg_cron) ? row(t("tgExt"), `<span class="badge b-bad">${t("tgExtMissing")}</span>`) : "");
    }catch(e){ $("#tgStatus").textContent = e.message; } };
    showTg();
    $("#tgForm").addEventListener("submit", async ev => { ev.preventDefault(); $("#tgErr").textContent = "";
      try{ await rpc("admin_set_telegram", {p_token: $("#tgToken").value.trim()||null, p_chat_id: $("#tgChat").value.trim()||null}); $("#tgToken").value = ""; toast(t("tgSaved")); showTg(); }
      catch(e){ $("#tgErr").textContent = e.message; } });
    $("#tgTest").onclick = async () => { try{ await rpc("admin_test_telegram"); toast(t("tgTestSent")); setTimeout(showTg, 3000); }catch(e){ toast(e.message, true); } };

  $("#pwForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const cur = $("#pwCur").value, nw = $("#pwNew").value, nw2 = $("#pwNew2").value, err = $("#pwErr");

    if(!cur || !nw || !nw2) return err.textContent = t("pwErrEmpty");
    if(nw.length < 8) return err.textContent = t("pwErrShort");
    if(!/[A-Za-z\u0600-\u06FF]/.test(nw) || !/[0-9\u0660-\u0669]/.test(nw)) return err.textContent = t("pwErrMix");
    if(nw !== nw2) return err.textContent = t("pwErrMatch");
    if(nw === cur) return err.textContent = t("pwErrSame");
    $("#pwBtn").disabled = true;
    try{
      // verify the current password first (re-authenticate), then change it
      try{ await signIn(session.email, cur); }
      catch(e){ err.textContent = e.status===0 ? e.message : t("pwErrCurrent"); return; }
      await api("/auth/v1/user", {method:"PUT", body:{password: nw}});
      $("#pwForm").reset(); toast(t("pwDone"));
    }catch(e){ err.textContent = e.message; }
    finally{ const b=$("#pwBtn"); if(b) b.disabled = false; }
  });
  if($("#pgBtn")) $("#pgBtn").onclick = async () => {
    const m = $("#pgM").value;
    if(!await confirmBox(t("purgeTitle"), t("purgeConfirm",{m}), t("purgeOk"))) return;
    try{ const n = await rpc("admin_purge_old_logs", {p_months: Number(m)}); toast(t("purged",{n})); }catch(e){ toast(e.message, true); }
  };
}

/* زر إظهار/إخفاء كلمة المرور لكل خانة كلمة مرور */
function addEyes(){
  document.querySelectorAll('input[type=password]:not([data-eye]), input[data-eye-shown]:not([data-eye])').forEach(inp => {
    inp.setAttribute("data-eye","1");
    const wrap = document.createElement("span"); wrap.className = "pw-wrap";
    inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp);
    const b = document.createElement("button"); b.type = "button"; b.className = "pw-eye"; b.textContent = "👁";
    b.title = t("pwShow"); b.setAttribute("aria-label", t("pwShow")); b.setAttribute("aria-pressed","false");
    b.onclick = () => { const show = inp.type === "password"; inp.type = show ? "text" : "password";
      b.textContent = show ? "🙈" : "👁"; const l = t(show ? "pwHide" : "pwShow"); b.title = l; b.setAttribute("aria-label", l); b.setAttribute("aria-pressed", String(show)); inp.focus(); };
    wrap.appendChild(b);
  });
}
new MutationObserver(addEyes).observe(document.body, {childList:true, subtree:true}); addEyes();
